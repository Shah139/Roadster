<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadster - Real-time Phone Tracking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            max-width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .panel-header {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse 2s infinite;
        }
        .status-indicator.connected {
            background: #27ae60;
        }
        .coordinates {
            font-size: 12px;
            color: #666;
            margin: 5px 0;
            font-family: monospace;
        }
        .phone-info {
            font-size: 13px;
            color: #34495e;
            margin: 8px 0;
            padding: 10px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 6px;
            border-left: 3px solid #3498db;
        }
        .connection-status {
            font-size: 12px;
            font-weight: bold;
            margin: 5px 0;
        }
        .connected { color: #27ae60; }
        .disconnected { color: #e74c3c; }
        .connecting { color: #f39c12; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .controls {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }
        
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin: 2px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #2980b9;
        }
        
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        
        .phone-marker {
            background: transparent !important;
            border: none !important;
        }
        
        .debug-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            max-width: 350px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            border: 1px solid #333;
        }
        
        .trail-controls {
            margin-top: 8px;
            font-size: 11px;
        }

        .server-info {
            font-size: 10px;
            color: #7f8c8d;
            margin-top: 8px;
            padding: 5px;
            background: rgba(0,0,0,0.05);
            border-radius: 3px;
            word-break: break-all;
        }

        .location-stats {
            margin-top: 8px;
            font-size: 11px;
            color: #555;
        }

        .stats-item {
            margin: 2px 0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <div class="panel-header">
            📱 Android Phone Tracker
            <div class="status-indicator" id="statusIndicator"></div>
        </div>
        
        <div class="connection-status disconnected" id="connectionStatus">
            Disconnected
        </div>
        
        <div class="phone-info" id="phoneInfo" style="display: none;">
            <div><strong>📍 Live Location:</strong></div>
            <div class="coordinates" id="coordinates">No location data</div>
            <div id="timestamp">-</div>
            <div id="userInfo" style="margin-top: 5px; font-size: 11px;"></div>

            <div class="location-stats" id="locationStats" style="display: none;">
                <div class="stats-item">
                    <span>🎯 Accuracy:</span>
                    <span id="accuracyValue">-</span>
                </div>
                <div class="stats-item">
                    <span>🚗 Speed:</span>
                    <span id="speedValue">-</span>
                </div>
                <div class="stats-item">
                    <span>🧭 Bearing:</span>
                    <span id="bearingValue">-</span>
                </div>
                <div class="stats-item">
                    <span>📦 Updates:</span>
                    <span id="updateCount">0</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="connectWebSocket()" id="connectBtn">Connect</button>
            <button class="btn" onclick="centerOnPhone()" id="centerBtn" disabled>Center on Phone</button>
            <button class="btn" onclick="clearTrail()" id="clearBtn">Clear Trail</button>
            <div class="trail-controls">
                <label>
                    <input type="checkbox" id="debugToggle" onchange="toggleDebug()"> Show Debug
                </label>
                <br>
                <label>
                    <input type="checkbox" id="autoCenter" checked> Auto Center
                </label>
            </div>
        </div>
        
        <div class="server-info">
            🌐 Server: https://8569284e503d.ngrok-free.app/ws<br>
            📡 Endpoint: /topic/locations
        </div>
    </div>
    
    <div id="map"></div>
    
    <div id="debugPanel" class="debug-panel">
        <div><strong>🔍 DEBUG INFO:</strong></div>
        <div id="debugContent">Waiting for Android location data...</div>
    </div>

    <!-- Include SockJS and STOMP libraries for WebSocket -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        // Global variables
        let map;
        let phoneMarker = null;
        let locationTrail = [];
        let trailPolyline = null;
        let stompClient = null;
        let isConnected = false;
        let lastKnownLocation = null;
        let updateCounter = 0;

        // WebSocket server URL - Updated to new ngrok URL
        const WEBSOCKET_URL = 'https://8569284e503d.ngrok-free.app/ws';

        // Initialize the map
        function initializeMap() {
            map = L.map('map').setView([22.4638, 91.9704], 12); // Default to Chittagong area based on your Android logs

            // Add OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors | Roadster Live Tracking',
                maxZoom: 19
            }).addTo(map);

            // Initialize trail polyline with better styling
            trailPolyline = L.polyline([], {
                color: '#e74c3c',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 5',
                lineJoin: 'round'
            }).addTo(map);

            console.log('🗺️ Map initialized - Ready for Android location data');
        }
        
        // WebSocket connection management
        function connectWebSocket() {
            if (isConnected) {
                disconnectWebSocket();
                return;
            }
            
            updateConnectionStatus('connecting', 'Connecting to Android...');
            console.log('🔄 Attempting to connect to:', WEBSOCKET_URL);

            try {
                // Create STOMP client with SockJS
                const socket = new SockJS(WEBSOCKET_URL);
                stompClient = new StompJs.Client({
                    webSocketFactory: () => socket,
                    connectHeaders: {},
                    debug: function (str) {
                        console.log('📡 STOMP Debug: ' + str);
                        updateDebugInfo('STOMP: ' + str);
                    },
                    reconnectDelay: 5000,
                    heartbeatIncoming: 4000,
                    heartbeatOutgoing: 4000,
                });

                stompClient.onConnect = function (frame) {
                    console.log('✅ Connected to WebSocket server:', frame);
                    isConnected = true;
                    updateConnectionStatus('connected', 'Connected - Waiting for phone...');
                    document.getElementById('connectBtn').textContent = 'Disconnect';
                    document.getElementById('centerBtn').disabled = false;
                    
                    // Subscribe to Android phone location updates
                    stompClient.subscribe('/topic/locations', function (message) {
                        try {
                            const locationData = JSON.parse(message.body);
                            console.log('📱 Received Android location:', locationData);
                            updatePhoneLocation(locationData);
                        } catch (error) {
                            console.error('❌ Error parsing location data:', error);
                            updateDebugInfo('Parse Error: ' + error.message);
                        }
                    });
                    
                    updateDebugInfo('WebSocket connected successfully');
                };

                stompClient.onStompError = function (frame) {
                    console.error('❌ STOMP error:', frame.headers['message']);
                    console.error('Additional details:', frame.body);
                    updateConnectionStatus('disconnected', 'Connection Error');
                    updateDebugInfo('STOMP Error: ' + frame.headers['message']);
                    isConnected = false;
                };

                stompClient.onWebSocketClose = function (event) {
                    console.log('🔌 WebSocket connection closed');
                    updateConnectionStatus('disconnected', 'Disconnected');
                    updateDebugInfo('Connection closed: ' + event.reason);
                    isConnected = false;
                    document.getElementById('connectBtn').textContent = 'Connect';
                    document.getElementById('centerBtn').disabled = true;
                };

                stompClient.activate();
                
            } catch (error) {
                console.error('❌ Error connecting to WebSocket:', error);
                updateConnectionStatus('disconnected', 'Connection Failed');
                updateDebugInfo('Connection failed: ' + error.message);
            }
        }
        
        function disconnectWebSocket() {
            if (stompClient && isConnected) {
                stompClient.deactivate();
                updateConnectionStatus('disconnected', 'Disconnected');
                document.getElementById('connectBtn').textContent = 'Connect';
                document.getElementById('centerBtn').disabled = true;
                isConnected = false;
                updateDebugInfo('Manually disconnected');
            }
        }
        
        // Update connection status UI
        function updateConnectionStatus(status, message) {
            const statusElement = document.getElementById('connectionStatus');
            const indicatorElement = document.getElementById('statusIndicator');
            
            statusElement.className = `connection-status ${status}`;
            statusElement.textContent = message;
            
            indicatorElement.className = `status-indicator ${status === 'connected' ? 'connected' : ''}`;
        }
        
        // Update phone location on map - Enhanced for Android data
        function updatePhoneLocation(locationData) {
            console.log('📍 Processing Android location data:', locationData);
            updateCounter++;

            // Update debug panel
            updateDebugInfo(locationData);

            // Handle different possible data formats from Android
            let lat, lng, userId, accuracy, speed, bearing, timestamp;

            if (locationData.latitude !== undefined && locationData.longitude !== undefined) {
                lat = parseFloat(locationData.latitude);
                lng = parseFloat(locationData.longitude);
                userId = locationData.userId || 'Android Device';
                accuracy = locationData.accuracy;
                speed = locationData.speed;
                bearing = locationData.bearing;
                timestamp = locationData.timestamp;
            } else {
                console.error('❌ Invalid location data format:', locationData);
                return;
            }

            if (isNaN(lat) || isNaN(lng)) {
                console.error('❌ Invalid coordinates:', lat, lng);
                return;
            }
            
            lastKnownLocation = { lat, lng };
            
            // Update connection status to show we're receiving data
            if (isConnected) {
                updateConnectionStatus('connected', 'Receiving live data');
            }

            // Update or create phone marker with custom Android icon
            if (phoneMarker) {
                phoneMarker.setLatLng([lat, lng]);
            } else {
                // Create Android phone icon
                const phoneIcon = L.divIcon({
                    className: 'phone-marker',
                    html: `<div style="
                        background: linear-gradient(45deg, #4CAF50, #2196F3);
                        border: 3px solid white;
                        border-radius: 50%;
                        width: 24px;
                        height: 24px;
                        box-shadow: 0 3px 10px rgba(0,0,0,0.4);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 12px;
                        color: white;
                    ">📱</div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
                
                phoneMarker = L.marker([lat, lng], {
                    icon: phoneIcon
                }).addTo(map);
                
                // Create detailed popup for Android data
                phoneMarker.on('click', function() {
                    updatePopupContent();
                });
            }
            
            // Add to trail
            locationTrail.push([lat, lng]);
            if (locationTrail.length > 200) { // Keep more points for longer trail
                locationTrail.shift();
            }
            
            // Update trail polyline
            trailPolyline.setLatLngs(locationTrail);
            
            // Update info panel with Android location details
            let coordinatesHtml = `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            document.getElementById('coordinates').innerHTML = coordinatesHtml;
            
            // Update user info
            document.getElementById('userInfo').innerHTML = `👤 User: <strong>${userId}</strong>`;

            // Update location stats
            const statsPanel = document.getElementById('locationStats');
            if (accuracy !== undefined || speed !== undefined || bearing !== undefined) {
                statsPanel.style.display = 'block';

                document.getElementById('accuracyValue').textContent =
                    accuracy ? `±${accuracy.toFixed(1)}m` : '-';

                document.getElementById('speedValue').textContent =
                    speed ? `${(speed * 3.6).toFixed(1)} km/h` : '-';

                document.getElementById('bearingValue').textContent =
                    bearing ? `${bearing.toFixed(0)}°` : '-';
            }

            document.getElementById('updateCount').textContent = updateCounter;

            // Format timestamp
            let timestampText = `🕒 ${new Date().toLocaleTimeString()}`;
            if (timestamp) {
                const deviceTime = new Date(timestamp);
                timestampText = `📱 ${deviceTime.toLocaleTimeString()} | 🌐 ${new Date().toLocaleTimeString()}`;
            }
            document.getElementById('timestamp').textContent = timestampText;
            document.getElementById('phoneInfo').style.display = 'block';
            
            // Auto-center if enabled
            const autoCenter = document.getElementById('autoCenter').checked;
            if (autoCenter && (locationTrail.length <= 2 || map.getZoom() < 12)) {
                map.setView([lat, lng], 16);
            }
            
            console.log(`✅ Android location updated: ${lat.toFixed(6)}, ${lng.toFixed(6)} (${userId})`);
        }

        function updatePopupContent() {
            if (!phoneMarker || !lastKnownLocation) return;

            const locationData = lastKnownLocation;
            let popupContent = `
                <div style="font-size: 13px; min-width: 200px;">
                    <strong>📱 Android Location</strong><br>
                    <strong>📍 Coordinates:</strong><br>
                    Lat: ${locationData.lat.toFixed(6)}<br>
                    Lng: ${locationData.lng.toFixed(6)}<br>
                    <strong>📊 Statistics:</strong><br>
                    Updates received: ${updateCounter}<br>
                    Trail points: ${locationTrail.length}<br>
                    <strong>⏰ Last update:</strong><br>
                    ${new Date().toLocaleString()}
                </div>
            `;

            phoneMarker.bindPopup(popupContent).openPopup();
        }
        
        // Center map on phone location
        function centerOnPhone() {
            if (lastKnownLocation) {
                map.setView([lastKnownLocation.lat, lastKnownLocation.lng], 17);
            } else {
                alert('No Android location available yet. Please ensure your phone app is connected and sending location data.');
            }
        }
        
        // Clear location trail
        function clearTrail() {
            locationTrail = [];
            trailPolyline.setLatLngs([]);
            updateCounter = 0;
            document.getElementById('updateCount').textContent = '0';
            console.log('🧹 Location trail cleared');
        }
        
        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeMap();

            // Setup map click events for debugging
            map.on('click', function(e) {
                console.log('🗺️ Map clicked at:', e.latlng);
            });

            console.log('🚀 Roadster Phone Tracker initialized');
            console.log('📡 Ready to receive Android location data from:', WEBSOCKET_URL);
        });
        
        // Debug functions
        function toggleDebug() {
            const debugPanel = document.getElementById('debugPanel');
            const debugToggle = document.getElementById('debugToggle');
            debugPanel.style.display = debugToggle.checked ? 'block' : 'none';
        }
        
        function updateDebugInfo(data) {
            const debugContent = document.getElementById('debugContent');
            const timestamp = new Date().toLocaleTimeString();
            
            let debugInfo;
            if (typeof data === 'string') {
                debugInfo = `[${timestamp}] ${data}`;
            } else {
                debugInfo = `[${timestamp}] Android Data Received:
${JSON.stringify(data, null, 2)}

Connection Status: ${isConnected ? 'CONNECTED' : 'DISCONNECTED'}
Total Updates: ${updateCounter}
Trail Points: ${locationTrail.length}`;
            }

            debugContent.innerHTML = debugInfo.replace(/\n/g, '<br>');

            // Auto-scroll to bottom
            debugContent.scrollTop = debugContent.scrollHeight;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (isConnected) {
                disconnectWebSocket();
            }
        });

        // Test function for development
        function testAndroidLocation() {
            if (!isConnected) {
                alert('Please connect to WebSocket first');
                return;
            }

            // Simulate Android location data format
            const testLocation = {
                userId: 'test_android_user',
                latitude: 22.4638383,
                longitude: 91.9703885,
                accuracy: 15.0,
                speed: 5.5,
                bearing: 45.0,
                timestamp: Date.now()
            };

            console.log('🧪 Testing with simulated Android data:', testLocation);
            updatePhoneLocation(testLocation);
        }

        // Make test function available in console
        window.testAndroidLocation = testAndroidLocation;

        console.log('💡 Tip: Use testAndroidLocation() in console to test with fake data');
    </script>
</body>
</html>
